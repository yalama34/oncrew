services:
  db:
    image: pgvector/pgvector:pg16
    container_name: recsyc_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.ai.mai.ru/}
      LLM_MODEL: ${LLM_MODEL:-DeepSeek-V4-Flash}
      LLM_INSECURE_TLS: ${LLM_INSECURE_TLS:-false}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:1234}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      MAX_LEAD_STEPS: ${MAX_LEAD_STEPS:-40}
      ONCREW_ORIGIN: ${ONCREW_ORIGIN:-http://localhost:3000}
      PREVIEW_CONTROL_ORIGIN: http://preview:8082
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - preview

  preview:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: preview
    restart: unless-stopped
    environment:
      ONCREW_ORIGIN: ${ONCREW_ORIGIN:-http://localhost:3000}
      PREVIEW_PUBLIC_ORIGIN: ${PREVIEW_PUBLIC_ORIGIN:-http://127.0.0.1:8081}
      PREVIEW_CONTROL_ADDR: ":8082"
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - preview
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 32

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  preview:
